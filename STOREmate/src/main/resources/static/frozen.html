<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frozen Foods</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
        }

        /* Header styling */
        h2 {
            color: #4caf50;
            text-align: center;
            margin-top: 20px;
        }

        /* Table styling */
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        th {
            background-color: #4caf50;
            color: white;
        }

        td {
            background-color: #f9f9f9;
        }

        tr:nth-child(even) td {
            background-color: #f1f1f1;
        }

        tr:hover td {
            background-color: #e2f7e3;
        }

        /* Button and input field styling */
        input[type="number"] {
            width: 70px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 7px 15px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            background-color: #388e3c;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            table {
                width: 100%;
            }

            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }

    </style>
</head>
<body>

<h2>Select Frozen foods to Add to Cart</h2>

<table id="fruitsTable">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price Per Packet (₹)</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <!-- Fruits will be loaded here -->
    </tbody>
</table>

<script>
    // Function to get query parameter from URL
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // Get the logged-in user's email from the URL
    const userEmail = getQueryParam("userEmail");  // This assumes the URL contains the parameter `userEmail`

    // Fetch fruits from backend
    fetch('http://localhost:8080/frozen/all')
        .then(response => response.json())
        .then(data => {
            const tableBody = document.querySelector("#fruitsTable tbody");

            data.forEach(fruit => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${fruit.product}</td>
                    <td>${fruit.priceperpacket}</td>
                    <td>
                        <input type="number" min="1" placeholder="Qty" id="qty-${fruit.id}">
                        <button onclick="addToCart('${fruit.product}', ${fruit.priceperpacket}, ${fruit.id})">Add</button>
                    </td>
                `;

                tableBody.appendChild(row);
            });
        })
        .catch(error => console.error('Error fetching fruits:', error));

    function addToCart(productName, priceperpacket, id) {
        const quantityInput = document.getElementById(`qty-${id}`);
        const quantity = quantityInput.value;

        if (!quantity || quantity <= 0) {
            alert("Please enter a valid quantity!");
            return;
        }

        const cartItem = [{
            userEmail: userEmail,
            productName: productName,
            price: priceperpacket,
            quantity: quantity
        }];

        fetch('http://localhost:8080/api/v1/cart/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(cartItem)
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message); // Backend message like "Item Apple added to cart."
            quantityInput.value = ''; // clear the input after adding
        })
        .catch(error => {
            console.error('Error adding to cart:', error);
            alert('Failed to add item to cart!');
        });
    }
</script>

</body>
</html>
