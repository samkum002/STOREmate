<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background: linear-gradient(to right, #ece9e6, #ffffff);
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #007bff;
            font-size: 2.5em;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #007bff;
            color: white;
            font-size: 1.1em;
            letter-spacing: 0.5px;
        }
        td {
            font-size: 1em;
        }
        tr:hover {
            background-color: #f7f7f7;
            transition: background-color 0.3s ease;
        }
        .sub-table {
            width: 100%;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .sub-table th {
            background-color: #17a2b8;
            color: white;
            font-size: 1em;
        }
        .highlight {
            font-size: 1.5em;
            font-weight: bold;
            color: #28a745;
        }
        .error {
            text-align: center;
            color: red;
            margin-top: 20px;
        }
        .form-container {
            margin: 20px auto;
            text-align: center;
        }
        .form-container input, .form-container button {
            padding: 10px;
            margin: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container input {
            width: 200px;
        }
        .form-container button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<h1>Admin Dashboard</h1>

<div id="response"></div>

<div class="form-container">
    <h2>Update Stock</h2>
    <input type="text" id="productName" placeholder="Product Name" required />
    <input type="number" id="quantityToAdd" placeholder="Quantity to Add" required />
    <button onclick="updateStock()">Update Stock</button>
    <div id="updateMessage" class="error"></div>
</div>

<script>
    // Fetch data from API to populate the table (optional part)
    fetch('http://localhost:8080/page/admin/dashboard')
        .then(response => response.json())
        .then(data => {
            let table = '<table>';
            table += '<tr><th>Field</th><th>Value</th></tr>';

            for (const key in data) {
                let value = data[key];

                if (key === 'allOrders' && Array.isArray(value)) {
                    let subTable = '<table class="sub-table">';
                    if (value.length > 0) {
                        subTable += '<tr>';
                        for (const header in value[0]) {
                            if (header !== 'id') {
                                subTable += `<th>${header}</th>`;
                            }
                        }
                        subTable += '</tr>';
                        value.forEach(item => {
                            subTable += '<tr>';
                            for (const field in item) {
                                if (field !== 'id') {
                                    subTable += `<td>${item[field]}</td>`;
                                }
                            }
                            subTable += '</tr>';
                        });
                    } else {
                        subTable += '<tr><td colspan="100%">No Orders Available</td></tr>';
                    }
                    subTable += '</table>';
                    table += `<tr><td>${key}</td><td>${subTable}</td></tr>`;
                } 
                else if (key === 'totalSales') {
                    table += `<tr><td>${key}</td><td class="highlight">₹${value.toLocaleString()}</td></tr>`;
                }
                else if (Array.isArray(value)) {
                    let subTable = '<table class="sub-table">';
                    value.forEach(item => {
                        subTable += '<tr>';
                        if (typeof item === 'object') {
                            subTable += '<td>';
                            for (const subKey in item) {
                                subTable += `<strong>${subKey}:</strong> ${item[subKey]}<br>`;
                            }
                            subTable += '</td>';
                        } else {
                            subTable += `<td>${item}</td>`;
                        }
                        subTable += '</tr>';
                    });
                    subTable += '</table>';
                    table += `<tr><td>${key}</td><td>${subTable}</td></tr>`;
                } 
                else if (typeof value === 'object') {
                    let subDetails = '';
                    for (const subKey in value) {
                        subDetails += `<strong>${subKey}:</strong> ${value[subKey]}<br>`;
                    }
                    table += `<tr><td>${key}</td><td>${subDetails}</td></tr>`;
                } 
                else {
                    table += `<tr><td>${key}</td><td>${value}</td></tr>`;
                }
            }

            table += '</table>';
            document.getElementById('response').innerHTML = table;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('response').innerHTML = '<p class="error">Failed to load data.</p>';
        });

    // Function to update stock
    function updateStock() {
        const productName = document.getElementById("productName").value;
        const quantityToAdd = document.getElementById("quantityToAdd").value;

        if (!productName || !quantityToAdd) {
            document.getElementById("updateMessage").innerHTML = "Both fields are required.";
            return;
        }

        const payload = {
            productName: productName,
            quantityToAdd: parseInt(quantityToAdd)
        };

        const apiUrl = 'http://localhost:8080/api/v1/cart/update-stock';  // Ensure this URL is correct

        // Send the PUT request
        fetch(apiUrl, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            console.log('Response Data:', data); // Log the response to debug
            
            if (data.success) {
                document.getElementById("updateMessage").innerHTML = "Stock updated successfully!";
                document.getElementById("productName").value = '';  // Clear input fields
                document.getElementById("quantityToAdd").value = '';
            } else {
                document.getElementById("updateMessage").innerHTML = data.message || "Failed to update stock.";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById("updateMessage").innerHTML = "Error updating stock.";
        });
    }
</script>

</body>
</html>
