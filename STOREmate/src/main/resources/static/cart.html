<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
        }

        /* Header styling */
        h2 {
            color: #4caf50;
            text-align: center;
            margin-top: 20px;
        }

        /* Table styling */
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        th {
            background-color: #4caf50;
            color: white;
        }

        td {
            background-color: #f9f9f9;
        }

        tr:nth-child(even) td {
            background-color: #f1f1f1;
        }

        tr:hover td {
            background-color: #e2f7e3;
        }

        /* Center the "Buy" button */
        .buy-btn-container {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            background-color: #388e3c;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            table {
                width: 100%;
            }

            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }

    </style>
</head>
<body>

<h2>Your Cart</h2>

<table id="cartTable">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <!-- Cart items will be loaded here -->
    </tbody>
</table>

<!-- Centered Buy Button -->
<div class="buy-btn-container">
    <button id="buyButton" onclick="placeOrder()">Place Order</button>
</div>

<script>
    // Function to get query parameter from URL
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // Get the logged-in user's email from the URL
    const userEmail = getQueryParam("userEmail");

    // Fetch cart items from backend
    fetch('http://localhost:8080/api/v1/cart/view?userEmail=' + userEmail)
        .then(response => response.json())
        .then(data => {
            const tableBody = document.querySelector("#cartTable tbody");

            data.forEach(item => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${item.productName}</td>
                    <td>${item.price}</td>
                    <td>${item.quantity}</td>
                    <td>
                        <button onclick="removeFromCart(${item.id})">Remove</button>
                    </td>
                `;

                tableBody.appendChild(row);
            });
        })
        .catch(error => console.error('Error fetching cart:', error));

    // Remove item from cart
    function removeFromCart(id) {
        fetch('http://localhost:8080/api/v1/cart/remove/' + id + '?userEmail=' + userEmail, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            location.reload();  // Reload page to refresh the cart view
        })
        .catch(error => {
            console.error('Error removing item:', error);
            alert('Failed to remove item!');
        });
    }

    // Place the order and redirect after showing the message
    function placeOrder() {
        fetch('http://localhost:8080/api/v1/cart/place-order', {
            method: 'POST'
        })
        .then(response => response.text())
        .then(data => {
            alert(data);  // Show order placement message
            window.location.href = 'category.html?userEmail=' + encodeURIComponent(userEmail); // Redirect to category page
        })
        .catch(error => {
            console.error('Error placing order:', error);
            alert('Failed to place order!');
        });
    }
</script>

</body>
</html>
